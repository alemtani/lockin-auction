name: daily email
on:
  schedule:
    # GitHub often starts scheduled runs late, most of all on the hour.
    # Ask for 7:17 PDT / 6:17 PST so a late start still lands before 8.
    - cron: '17 14 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip if today's email already went out
        id: sent
        run: test -f "data/season/out/$(TZ=America/Los_Angeles date +%F).txt" && echo done=1 >> "$GITHUB_OUTPUT" || true
      - run: python3 -m unittest discover season
        if: steps.sent.outputs.done != '1'
      - run: python3 season/daily.py --send
        if: steps.sent.outputs.done != '1'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Save the model history
        run: |
          git config user.name 'lockin-bot'
          git config user.email 'lockin-bot@users.noreply.github.com'
          git add data/season
          git diff --cached --quiet || git commit -m "Daily model update $(date -u +%F)"
          git push
