name: daily email
on:
  schedule:
    # cron-job.org starts the run at 12:00am PT. This is the backup.
    # Cron is UTC only, so ask for both 12:12am PDT (07:12) and 12:12am PST (08:12).
    # The check below drops the run that lands before midnight or after the day's send.
    - cron: '12 7 * * *'
    - cron: '12 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Skip if before midnight PT or today's email already went out
        id: sent
        run: |
          if [ "${{ github.event_name }}" = schedule ] && [ "$(TZ=America/Los_Angeles date +%H)" -eq 23 ]; then
            echo done=1 >> "$GITHUB_OUTPUT"
          elif [ -f "data/season/out/$(TZ=America/Los_Angeles date +%F).txt" ]; then
            echo done=1 >> "$GITHUB_OUTPUT"
          fi
      - run: python3 -m unittest discover season
        if: steps.sent.outputs.done != '1'
      - run: python3 season/daily.py --send
        if: steps.sent.outputs.done != '1'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      - name: Save the model history
        run: |
          git config user.name 'lockin-bot'
          git config user.email 'lockin-bot@users.noreply.github.com'
          git add data/season
          git diff --cached --quiet || git commit -m "Daily model update $(date -u +%F)"
          git push
