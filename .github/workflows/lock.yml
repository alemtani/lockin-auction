name: lock record
# Record a lock you made against the email's call (or a call you skipped). Run it from the GitHub app:
# Actions > lock record > Run workflow. It adds a line to data/season/locks.txt and commits it.
# Every record resends today's email with the change (once today's email has gone out).
# Docs: README.md, "GitHub actions".
# team: opponent records a lock the email guessed wrong for your opponent (data/season/opp_locks.txt).
on:
  workflow_dispatch:
    inputs:
      team:
        description: Whose player (opponent = fix a lock the email guessed for them)
        required: true
        type: choice
        options: [mine, opponent]
        default: mine
      player:
        description: Player (any part of the name, e.g. durant)
        required: true
        type: string
      call:
        description: What was done (roll = the game was not locked)
        required: true
        type: choice
        options: [lock, roll]
      date:
        description: Game date YYYY-MM-DD (blank = his latest game)
        required: false
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: lockin-data  # same group as the daily email, so two runs never push at once
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add the line
        run: python3 season/add_lock.py --team "$TEAM" --player "$PLAYER" --call "$CALL" --date "$DATE"
        env:
          TEAM: ${{ inputs.team }}
          PLAYER: ${{ inputs.player }}
          CALL: ${{ inputs.call }}
          DATE: ${{ inputs.date }}
      # A record changes the scores, the matchup and the calls, so today's email is resent with it.
      # Only once today's email has gone out: before that (after midnight, before the 3am run) the line
      # is saved and the morning email uses it. Resending first would make the daily run skip as "already sent".
      - name: Send today's email again
        run: |
          if [ -f "data/season/out/$(TZ=America/Los_Angeles date +%F).txt" ]; then
            python3 season/daily.py --send
          else
            echo "Today's email hasn't gone out yet; the morning email will use this record." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WIN_PROB: ${{ vars.WIN_PROB }}  # same settings as the daily email
          OPP_UNLOCKED: ${{ vars.OPP_UNLOCKED }}
      - name: Save
        run: |
          git config user.name 'lockin-bot'
          git config user.email 'lockin-bot@users.noreply.github.com'
          git add data/season
          git diff --cached --quiet || git commit -m "Lock record ($TEAM): $PLAYER $CALL"
          git pull --rebase -q
          git push
        env:
          TEAM: ${{ inputs.team }}
          PLAYER: ${{ inputs.player }}
          CALL: ${{ inputs.call }}
